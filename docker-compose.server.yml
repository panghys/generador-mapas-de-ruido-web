# SERVIDOR — descarga las imagenes de GHCR, NO construye.
# NO publica puertos: Caddy (contenedor en red_taller_software) llega por container_name:
#   grupo3.146.83.216.166.nip.io/api/*  ->  grupo3_backend:4003
#   grupo3.146.83.216.166.nip.io/*      ->  grupo3_frontend:3003
# El .env vive SOLO en el servidor, junto a este archivo. Lo sube deploy.sh como docker-compose.yml.

# version explícita: el servidor tiene un Compose viejo que la exige.
# (Compose v2 moderno la ignora con un warning inofensivo.)
version: "3.8"

services:
  grupo3_db:
    image: mariadb:11
    container_name: grupo3_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/var/lib/mysql
    networks:
      - red_taller_software

  grupo3_backend:
    image: ghcr.io/panghys/generador-mapas-de-ruido-web-backend:latest
    container_name: grupo3_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo3_db
    networks:
      - red_taller_software

  grupo3_frontend:
    image: ghcr.io/panghys/generador-mapas-de-ruido-web-frontend:latest
    container_name: grupo3_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo3_backend
    networks:
      - red_taller_software

volumes:
  data:

networks:
  red_taller_software:
    external: true